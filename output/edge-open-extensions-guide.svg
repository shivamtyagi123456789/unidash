<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#eef2f7"/>
  <text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142033">Open the Edge Extensions page</text>
  <text x="60" y="116" font-family="Arial,sans-serif" font-size="22" fill="#40516b">Click the highlighted address bar, type the address, then press Enter.</text>
  <rect x="40" y="165" width="1120" height="470" rx="18" fill="#202124" stroke="#9aa4b2" stroke-width="2"/>
  <rect x="40" y="165" width="1120" height="58" rx="18" fill="#17181a"/>
  <circle cx="72" cy="194" r="9" fill="#f06a64"/><circle cx="101" cy="194" r="9" fill="#f6c453"/><circle cx="130" cy="194" r="9" fill="#5fc878"/>
  <rect x="175" y="177" width="350" height="37" rx="12" fill="#292b2f"/>
  <text x="205" y="202" font-family="Arial,sans-serif" font-size="17" fill="#c5c9d0">UniDash</text>
  <rect x="545" y="177" width="575" height="37" rx="12" fill="#292b2f"/>
  <text x="578" y="202" font-family="Arial,sans-serif" font-size="17" fill="#c5c9d0">New tab</text>
  <rect x="55" y="239" width="1090" height="70" rx="20" fill="#303134" stroke="#e5484d" stroke-width="6"/>
  <circle cx="88" cy="274" r="10" fill="none" stroke="#aeb4bf" stroke-width="3"/>
  <text x="117" y="283" font-family="Arial,sans-serif" font-size="27" fill="#ffffff">edge://extensions</text>
  <rect x="818" y="246" width="309" height="55" rx="13" fill="#7f1d1d"/>
  <text x="842" y="280" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">1 · TYPE HERE</text>
  <path d="M970 313 C970 365 900 370 835 386" fill="none" stroke="#e5484d" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="130" y="410" width="940" height="165" rx="18" fill="#fff" stroke="#c9d2df" stroke-width="2"/>
  <text x="175" y="466" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#142033">2 · Press Enter on your keyboard</text>
  <text x="175" y="514" font-family="Arial,sans-serif" font-size="21" fill="#40516b">Edge will open the Extensions management page.</text>
  <text x="175" y="550" font-family="Arial,sans-serif" font-size="18" fill="#62728a">There, turn on Developer mode and choose Load unpacked.</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e5484d"/></marker></defs>
</svg>
